name: Feature request
description: Suggest something the meter should show or warn about.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would help
      description: The problem you're trying to solve, not only the solution.
    validations:
      required: true
  - type: checkboxes
    id: promise
    attributes:
      label: No extra cost
      options:
        - label: This can be done without model calls or network access.
