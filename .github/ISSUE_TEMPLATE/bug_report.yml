name: Bug report
description: Something in the usage line, warnings or command is wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot of the line helps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: billing
    attributes:
      label: How you use Claude Code
      options:
        - Pro or Max subscription
        - API key
        - Cloud provider (Bedrock, Vertex AI, Foundry)
        - Other
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Terminal
        - Desktop app
        - VS Code
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
